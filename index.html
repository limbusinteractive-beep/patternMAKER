<html lang="pt">
<head>
<meta charset="utf-8">

<title>Pattern Nodes</title>

<style>
:root{
  --bg:#efece5; --panel:#fbfaf7; --panel2:#f3f0e9; --ink:#1f1d1a; --muted:#6f6a61; --line:#d9d3c7; --grid:#d3cdc0;
  --accent:#c2562f; --wire:#8c857a; --node:#fdfcf9; --nodehead:#f1ede5; --shadow:0 2px 10px rgba(40,30,10,.10);
  --c-gen:#2c8a85; --c-nat:#4c8a36; --c-sac:#b88a1e; --c-tr:#7656c0; --c-pat:#376bc0; --c-mask:#c04a70; --c-out:#5b5752;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121315; --panel:#1a1b1e; --panel2:#202226; --ink:#ece9e3; --muted:#9b968d; --line:#2d2f34; --grid:#2a2c31;
    --accent:#e57d52; --wire:#7d786f; --node:#1d1f23; --nodehead:#24262b; --shadow:0 2px 12px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#121315; --panel:#1a1b1e; --panel2:#202226; --ink:#ece9e3; --muted:#9b968d; --line:#2d2f34; --grid:#2a2c31;
  --accent:#e57d52; --wire:#7d786f; --node:#1d1f23; --nodehead:#24262b; --shadow:0 2px 12px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.35 "IBM Plex Sans",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px 0;display:flex;flex-direction:column;gap:6px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font:600 15px "IBM Plex Sans";letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px}
.spacer{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
select.btn{padding:5px 6px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{border:1px solid transparent;border-bottom:none;padding:5px 10px;border-radius:6px 6px 0 0;cursor:pointer;color:var(--muted);background:none;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tab i{width:8px;height:8px;border-radius:2px;display:inline-block}
.tab.on{background:var(--bg);border-color:var(--line);color:var(--ink)}
.ribbon{background:var(--bg);margin:0 -12px;padding:7px 12px;border-top:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.ribbon .btn{background:var(--node);font-size:12px;display:flex;gap:6px;align-items:center}
.ribbon .btn i{width:6px;height:14px;border-radius:2px}
main{flex:1;display:grid;grid-template-columns:1fr minmax(320px,38%);min-height:0}
#graph{position:relative;overflow:hidden;touch-action:none;cursor:grab;
  background-color:var(--bg);background-image:radial-gradient(var(--grid) 1px,transparent 1.2px);background-size:22px 22px}
#graph.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#wires{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#wires path{fill:none;stroke:var(--wire);stroke-width:2.2}
#wires path.hot{stroke:var(--accent);stroke-dasharray:5 4}
.gtools{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;z-index:5}
.hint{position:absolute;left:10px;bottom:10px;color:var(--muted);font-size:11px;z-index:5;pointer-events:none;max-width:60%}
.node{position:absolute;width:206px;background:var(--node);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);cursor:default;user-select:none}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent),var(--shadow)}
.node.err{border-color:#d33}
.nh{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 10px;background:var(--nodehead);border-radius:8px 8px 0 0;cursor:move;border-bottom:1px solid var(--line);position:relative}
.nh::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cc);border-radius:8px 0 0 0}
.nh .tt{flex:1;font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nh .x{border:none;background:none;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 2px}
.nh .x:hover{color:var(--accent)}
.nb{padding:6px 8px 8px}
.thumb{width:100%;height:auto;aspect-ratio:190/104;display:block;border-radius:5px;border:1px solid var(--line);background:var(--panel2);margin:2px 0 6px}
.port{display:flex;align-items:center;gap:6px;font:11px "IBM Plex Mono",monospace;color:var(--muted);height:20px;position:relative}
.port .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--wire);background:var(--node);cursor:crosshair;flex:none;position:relative}
.port.in .dot{margin-left:-15px}
.port .dot:hover,.port .dot.on{border-color:var(--accent);background:var(--accent)}
.port.out{position:absolute;right:-7px;top:6px;height:auto}
.port.out .dot{width:13px;height:13px}
.port .ty{opacity:.6}
.prm{margin:4px 0}
.prm label{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--muted)}
.prm output{font-family:"IBM Plex Mono",monospace;color:var(--ink)}
.prm input[type=range]{width:100%;margin:2px 0 0;accent-color:var(--accent);height:16px}
.prm select{width:100%;margin-top:2px;padding:3px 4px;border:1px solid var(--line);border-radius:4px;background:var(--panel2)}
.prm .chk{justify-content:flex-start;align-items:center;color:var(--ink);cursor:pointer}
.prm .chk input{accent-color:var(--accent);margin:0}
.mx{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;touch-action:none;margin-top:4px;cursor:crosshair}
.mx div{aspect-ratio:1;background:var(--panel2)}
.mx div.f{background:var(--ink)}
.mxb{display:flex;gap:4px;margin-top:4px}
.mxb button{flex:1;font-size:11px;padding:2px 4px;border:1px solid var(--line);border-radius:4px;background:var(--panel2);cursor:pointer}
.outnote{font-size:11px;color:var(--muted);padding:2px 0}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:auto}
.pv{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--panel2)}
#preview{max-width:100%;max-height:52vh;box-shadow:var(--shadow);border-radius:3px;background:#fff}
.pvbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sec{padding:10px 14px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.row label{font-size:12px;color:var(--muted);min-width:92px}
.row input[type=number]{width:78px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--panel2)}
.row input[type=color]{width:34px;height:26px;border:1px solid var(--line);border-radius:5px;padding:1px;background:var(--panel2);cursor:pointer}
.row input[type=range]{flex:1;accent-color:var(--accent)}
.row select{flex:1;padding:4px;border:1px solid var(--line);border-radius:5px;background:var(--panel2)}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;padding:0;cursor:pointer;height:22px}
.sw button span{width:14px;height:100%}
.ck{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}
.ck input{accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
@media (max-width:820px){
  body{overflow:auto;height:auto}
  main{grid-template-columns:1fr;grid-template-rows:62vh auto}
  aside{border-left:none;border-top:1px solid var(--line);overflow:visible}
  #preview{max-height:70vw}
  .hint{display:none}
}
</style>

<body>
<header>

    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="4"/><circle cx="16" cy="12" r="4"/><circle cx="8" cy="12" r="4"/><circle cx="14" cy="8.5" r="4"/><circle cx="10" cy="8.5" r="4"/><circle cx="14" cy="15.5" r="4"/><circle cx="10" cy="15.5" r="4"/></svg>
      Pattern Nodes
    </div>

    <label class="btn" style="cursor:pointer">Abrir grafo<input type="file" id="fileJ" accept=".json" hidden></label>

<main>
  <section id="graph">

  <aside>

      </div>
      <div class="pvbar">

      </div>
    </div>
    <div class="sec">
      <h3>Canvas</h3>

        <input type="number" id="W" min="64" max="8000"> × <input type="number" id="H" min="64" max="8000">
      </div>

        <select id="sizeSel">
          <option value="">—</option>

          <option value="2480x3508">A4 vertical 300dpi</option>
          <option value="3508x2480">A4 horizontal 300dpi</option>
        </select>

      <div class="sw" id="palettes"></div>

      <div class="row"><label>Espessura</label><input type="range" id="lw" min="0" max="12" step="0.1"><span id="lwv" style="font-family:'IBM Plex Mono';font-size:11px;width:30px"></span></div>
      <div class="row"><label>Sobreposição</label>
        <select id="rule"><option value="evenodd">Alternar (even-odd)</option><option value="nonzero">Unir (non-zero)</option></select>

      <div class="row"><label>Cor do contorno da máscara</label><input type="color" id="maskCol"></div>
    </div>
  </aside>
</main>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* =================== GEOMETRIA =================== */
const TAU=Math.PI*2, PHI=(1+Math.sqrt(5))/2, D2R=Math.PI/180;
const P=(pts,closed=true)=>({pts,closed});
const circ=(cx,cy,r,n=72)=>{const p=[];for(let i=0;i<n;i++){const a=i/n*TAU;p.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}return P(p)};
const ngon=(n,r=1,rot=-Math.PI/2,cx=0,cy=0)=>{const p=[];for(let i=0;i<n;i++){const a=rot+i/n*TAU;p.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}return P(p)};
const seg=(a,b)=>P([[a[0],a[1]],[b[0],b[1]]],false);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
function rng(seed){let s=(seed*2654435761)>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function hash2(i,j,seed=0){let h=(Math.imul(i,374761393)+Math.imul(j,668265263)+Math.imul(seed,1013904223))|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296}
function normalize(shape){
  if(!shape||!shape.length)return shape;
  let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;
  for(const p of shape)for(const [x,y] of p.pts){if(x<a)a=x;if(y<b)b=y;if(x>c)c=x;if(y>d)d=y}
  const cx=(a+c)/2,cy=(b+d)/2;let r=0;
  for(const p of shape)for(const [x,y] of p.pts)r=Math.max(r,Math.hypot(x-cx,y-cy));
  if(r<1e-9)r=1;
  return shape.map(p=>P(p.pts.map(([x,y])=>[(x-cx)/r,(y-cy)/r]),p.closed));
}
function xform(shape,{sx=1,sy=1,rot=0,dx=0,dy=0,fx=1}){
  const c=Math.cos(rot),s=Math.sin(rot);
  return shape.map(p=>P(p.pts.map(([x,y])=>{x*=sx*fx;y*=sy;return[x*c-y*s+dx,x*s+y*c+dy]}),p.closed));
}
function plen(p){let L=0;const n=p.pts.length;for(let i=1;i<n;i++)L+=Math.hypot(p.pts[i][0]-p.pts[i-1][0],p.pts[i][1]-p.pts[i-1][1]);if(p.closed&&n>1)L+=Math.hypot(p.pts[0][0]-p.pts[n-1][0],p.pts[0][1]-p.pts[n-1][1]);return L}
function centroid(p){let x=0,y=0;for(const q of p.pts){x+=q[0];y+=q[1]}return[x/p.pts.length,y/p.pts.length]}
function area(p){let a=0;const n=p.pts.length;for(let i=0;i<n;i++){const[x1,y1]=p.pts[i],[x2,y2]=p.pts[(i+1)%n];a+=x1*y2-x2*y1}return a/2}
function resample(p,N){
  const pts=p.pts.slice();if(p.closed)pts.push(pts[0]);
  const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const tot=L[L.length-1];
  if(tot<1e-9||pts.length<2)return P(Array.from({length:N},()=>[pts[0][0],pts[0][1]]),p.closed);
  const cnt=p.closed?N:N-1,out=[];let j=0;
  for(let i=0;i<N;i++){const d=tot*i/cnt;while(j<L.length-2&&L[j+1]<d)j++;const sl=(L[j+1]-L[j])||1,u=(d-L[j])/sl;out.push([pts[j][0]+(pts[j+1][0]-pts[j][0])*u,pts[j][1]+(pts[j+1][1]-pts[j][1])*u])}
  return P(out,p.closed);
}
function chaikin(p,it){
  let pts=p.pts;
  for(let k=0;k<it;k++){const n=pts.length;if(n<3)break;const out=[];const m=p.closed?n:n-1;if(!p.closed)out.push(pts[0]);
    for(let i=0;i<m;i++){const a=pts[i],b=pts[(i+1)%n];out.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75])}
    if(!p.closed)out.push(pts[n-1]);pts=out}
  return P(pts,p.closed);
}
/* ---- matriz -> contorno ---- */
function matrixContours(cells,res){
  const g=(x,y)=>x>=0&&y>=0&&x<res&&y<res&&cells[y*res+x]==='1';
  const edges=new Map(),add=(a,b)=>{const k=a[0]+','+a[1];if(!edges.has(k))edges.set(k,[]);edges.get(k).push([a,b])};
  for(let y=0;y<res;y++)for(let x=0;x<res;x++){if(!g(x,y))continue;
    if(!g(x,y-1))add([x,y],[x+1,y]);if(!g(x+1,y))add([x+1,y],[x+1,y+1]);
    if(!g(x,y+1))add([x+1,y+1],[x,y+1]);if(!g(x-1,y))add([x,y+1],[x,y])}
  const loops=[];
  for(const [k,list] of edges){while(list.length){let e=list.pop();const loop=[e[0]];let cur=e[1],guard=0;
    while(guard++<10000){const kk=cur[0]+','+cur[1];if(kk===k&&loop.length>1)break;loop.push(cur);const l2=edges.get(kk);if(!l2||!l2.length)break;const e2=l2.pop();cur=e2[1]}
    const simp=[];for(let i=0;i<loop.length;i++){const a=loop[(i-1+loop.length)%loop.length],b=loop[i],c=loop[(i+1)%loop.length];if((b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0])!==0)simp.push(b)}
    if(simp.length>2)loops.push(simp)}}
  const h=res/2;return loops.map(l=>P(l.map(([x,y])=>[(x-h)/h,(y-h)/h])));
}
function defaultCells(res){let s='';const c=(res-1)/2;for(let y=0;y<res;y++)for(let x=0;x<res;x++){const dx=Math.abs(x-c),dy=Math.abs(y-c)*0.8;s+=(dx+dy<=res*0.42&&!(dx<1&&dy<1&&res>6))?'1':'0'}return s}
/* ---- morph ---- */
function prepMorph(A,B,N=144){
  const prep=s=>s.map(p=>({p,L:plen(p)})).sort((a,b)=>b.L-a.L).map(o=>resample(o.p,N));
  const a=prep(A),b=prep(B);
  while(a.length<b.length){const q=b[a.length],c=centroid(q);a.push(P(Array.from({length:N},()=>[c[0],c[1]]),q.closed))}
  while(b.length<a.length){const q=a[b.length],c=centroid(q);b.push(P(Array.from({length:N},()=>[c[0],c[1]]),q.closed))}
  return a.map((pa,i)=>{let pb=b[i];
    if(pa.closed&&pb.closed){
      if(Math.sign(area(pa))!==Math.sign(area(pb))&&Math.abs(area(pb))>1e-9)pb=P(pb.pts.slice().reverse(),true);
      let best=0,bv=Infinity;const st=Math.max(1,Math.floor(N/96));
      for(let k=0;k<N;k+=st){let s=0;for(let j=0;j<N;j+=3){const p1=pa.pts[j],p2=pb.pts[(j+k)%N];s+=(p1[0]-p2[0])**2+(p1[1]-p2[1])**2}if(s<bv){bv=s;best=k}}
      if(best)pb=P(pb.pts.slice(best).concat(pb.pts.slice(0,best)),true)}
    return[pa,pb]});
}
const lerpPrep=(pairs,t)=>pairs.map(([a,b])=>P(a.pts.map((p,i)=>[p[0]+(b.pts[i][0]-p[0])*t,p[1]+(b.pts[i][1]-p[1])*t]),t<.5?a.closed:b.closed));

/* ---- grelhas ---- */
function gridCells(type,cell,W,H,seam){
  const out=[];let dx=cell,dy=cell,off=0,cols,rows;
  if(type==='hex'){dy=cell*Math.sqrt(3)/2;off=.5}
  if(type==='tijolo'){dy=cell*.5;off=.5}
  if(type==='tri'){dx=cell/2;dy=cell*Math.sqrt(3)/2}
  let sc=1;
  if(seam){cols=Math.max(2,2*Math.round(W/dx/2));rows=Math.max(2,2*Math.round(H/dy/2));const nx=W/cols,ny=H/rows;sc=nx/dx;dx=nx;dy=ny}
  else{cols=Math.ceil(W/dx);rows=Math.ceil(H/dy)}
  for(let j=-2;j<=rows+2;j++)for(let i=-2;i<=cols+2;i++){

let tempWire=null;
function drawWires(){let s='';document.querySelectorAll('.port .dot.on').forEach(d=>d.classList.remove('on'));
  for(const l of G.links){const o=world.querySelector(`[data-out="${l.from}"]`),i=world.querySelector(`[data-in="${l.to}"][data-port="${l.port}"]`);if(!o||!i)continue;i.classList.add('on');o.classList.add('on');s+=`<path d="${curve(portPos(o),portPos(i))}"/>`}
  if(tempWire)s+=`<path class="hot" d="${curve(tempWire.a,tempWire.b)}"/>`;wires.innerHTML=s}
function applyView(){world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.z})`}
function reaches(fromId,toId){const st=[fromId],seen=new Set();while(st.length){const c=st.pop();if(c===toId)return true;if(seen.has(c))continue;seen.add(c);G.links.filter(l=>l.from===c).forEach(l=>st.push(l.to))}return false}

/* ---- interação no grafo ---- */
let drag=null;
graphEl.addEventListener('pointerdown',e=>{
  const outDot=e.target.closest('[data-out]'),inDot=e.target.closest('[data-in]'),head=e.target.closest('.nh');
  if(outDot){e.preventDefault();drag={k:'wire',from:+outDot.dataset.out};tempWire={a:portPos(outDot),b:portPos(outDot)};graphEl.setPointerCapture(e.pointerId);return}
  if(inDot){const l=G.links.find(l=>l.to===+inDot.dataset.in&&l.port===inDot.dataset.port);if(l){e.preventDefault();G.links=G.links.filter(x=>x!==l);const o=world.querySelector(`[data-out="${l.from}"]`);drag={k:'wire',from:l.from};tempWire={a:portPos(o),b:portPos(inDot)};graphEl.setPointerCapture(e.pointerId);drawWires();changed()}return}
  if(head&&!e.target.closest('.x')){const n=nodeById(+head.parentNode.dataset.id);select(n.id);drag={k:'node',n,sx:e.clientX,sy:e.clientY,ox:n.x,oy:n.y,el:head.parentNode};graphEl.setPointerCapture(e.pointerId);return}
  if(e.target===graphEl||e.target===world||e.target===wires||e.target.classList.contains('hint')){select(null);drag={k:'pan',sx:e.clientX,sy:e.clientY,ox:view.x,oy:view.y};graphEl.classList.add('panning');graphEl.setPointerCapture(e.pointerId)}
});
graphEl.addEventListener('pointermove',e=>{if(!drag)return;
  if(drag.k==='pan'){view.x=drag.ox+e.clientX-drag.sx;view.y=drag.oy+e.clientY-drag.sy;applyView()}
  else if(drag.k==='node'){drag.n.x=drag.ox+(e.clientX-drag.sx)/view.z;drag.n.y=drag.oy+(e.clientY-drag.sy)/view.z;drag.el.style.left=drag.n.x+'px';drag.el.style.top=drag.n.y+'px';drawWires()}
  else if(drag.k==='wire'){const w=world.getBoundingClientRect();tempWire.b=[(e.clientX-w.left)/view.z,(e.clientY-w.top)/view.z];drawWires()}});
graphEl.addEventListener('pointerup',e=>{if(!drag)return;
  if(drag.k==='wire'){const t=document.elementFromPoint(e.clientX,e.clientY),inDot=t&&t.closest('[data-in]');
    if(inDot){const to=nodeById(+inDot.dataset.in),from=nodeById(drag.from),port=inDot.dataset.port,it=DEFS[to.type].in.find(x=>x.n===port);
      if(to.id===from.id||reaches(to.id,from.id))toast('Isso criaria um ciclo');else if(!canConnect(DEFS[from.type].out,it.t))toast('Tipo incompatível: esta entrada espera uma forma');else{link(from,to,port);changed()}}
    tempWire=null;drawWires()}
  if(drag.k==='node')save();
  graphEl.classList.remove('panning');drag=null});
graphEl.addEventListener('wheel',e=>{if(e.target.closest('select'))return;e.preventDefault();const r=graphEl.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,z=clamp(view.z*Math.exp(-e.deltaY*.0015),.25,2.2);
  view.x=mx-(mx-view.x)*z/view.z;view.y=my-(my-view.y)*z/view.z;view.z=z;applyView();save()},{passive:false});
document.addEventListener('keydown',e=>{if((e.key==='Delete'||e.key==='Backspace')&&selected&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){const n=nodeById(selected);if(n)deleteNode(n)}});
function fit(){const els=[...world.querySelectorAll('.node')];if(!els.length)return;let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;
  for(const el of els){const n=nodeById(+el.dataset.id);a=Math.min(a,n.x);b=Math.min(b,n.y);c=Math.max(c,n.x+el.offsetWidth);d=Math.max(d,n.y+el.offsetHeight)}
  const W=graphEl.clientWidth,H=graphEl.clientHeight;view.z=clamp(Math.min((W-40)/(c-a),(H-50)/(d-b)),.3,1);view.x=(W-(c-a)*view.z)/2-a*view.z;view.y=Math.max(10,(H-(d-b)*view.z)/2)-b*view.z;applyView();drawWires()}

/* =================== AVALIAÇÃO =================== */
let pending=false;
function changed(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;evaluate();save()})}
function evaluate(){
  const C={W:S.W,H:S.H},cache=new Map(),busy=new Set();
  const ev=n=>{if(cache.has(n.id))return cache.get(n.id);if(busy.has(n.id))return null;busy.add(n.id);const def=DEFS[n.type],ins={};
    for(const inp of def.in){const l=G.links.find(l=>l.to===n.id&&l.port===inp.n);const src=l&&nodeById(l.from);ins[inp.n]=src?ev(src):null}
    let out=null,err=null;try{out=def.f(ins,n.params,C)||null}catch(e){err=e;console.error(e)}
    const el=document.querySelector(`.node[data-id="${n.id}"]`);if(el){el.classList.toggle('err',!!err);el.title=err?String(err.message):''}
    cache.set(n.id,out);busy.delete(n.id);return out};
  G.nodes.forEach(ev);results=cache;
  const tS={...S};
  for(const n of G.nodes){const cv=document.querySelector(`.node[data-id="${n.id}"] .thumb`);if(!cv)continue;const ctx=cv.getContext('2d'),v=cache.get(n.id);ctx.setTransform(1,0,0,1,0,0);
    if(!v){ctx.fillStyle=css('--panel2');ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle=css('--muted');ctx.font='22px IBM Plex Sans';ctx.textAlign='center';ctx.fillText(DEFS[n.type].in.length?'liga uma entrada':'—',cv.width/2,cv.height/2+7);continue}
    if(Array.isArray(v))renderShapeThumb(ctx,v,cv.width,cv.height,tS);
    else{const sc=Math.min(cv.width/S.W,cv.height/S.H);ctx.fillStyle=css('--panel2');ctx.fillRect(0,0,cv.width,cv.height);ctx.save();ctx.translate((cv.width-S.W*sc)/2,(cv.height-S.H*sc)/2);ctx.scale(sc,sc);ctx.beginPath();ctx.rect(0,0,S.W,S.H);ctx.clip();renderPattern(ctx,v,S.W,S.H,{...tS,lw:S.lw>0?Math.max(S.lw,.8/sc):0});ctx.restore()}}
  drawPreview();
}
function outputPattern(){const o=G.nodes.find(n=>n.type==='output');return o?results.get(o.id):null}
function drawPreview(){
  const cv=document.getElementById('preview'),maxD=900,sc=Math.min(1,maxD/Math.max(S.W,S.H));
  cv.width=Math.round(S.W*sc);cv.height=Math.round(S.H*sc);const ctx=cv.getContext('2d'),pat=outputPattern();
  if(S.tile2){const off=document.createElement('canvas');off.width=Math.round(cv.width/2);off.height=Math.round(cv.height/2);const o=off.getContext('2d');o.scale(sc/2,sc/2);renderPattern(o,pat,S.W,S.H,S);
    for(let i=0;i<2;i++)for(let j=0;j<2;j++)ctx.drawImage(off,i*off.width,j*off.height)}
  else{ctx.setTransform(sc,0,0,sc,0,0);renderPattern(ctx,pat,S.W,S.H,S);ctx.setTransform(1,0,0,1,0,0)}
  if(!pat){ctx.fillStyle='#8888';ctx.font='15px IBM Plex Sans';ctx.textAlign='center';ctx.fillText('Liga algo ao nó Saída',cv.width/2,cv.height/2)}
}

/* =================== EXEMPLOS =================== */
const PRESETS={
  'Favo hexagonal sem costuras':()=>{const a=addNode('polygon',40,40,{lados:6,aneis:3,rot:30});const t=addNode('tile',300,40,{grade:'hex',cel:110,esc:1.0});const o=addNode('output',560,40);link(a,t,'forma');link(t,o,'entrada');Object.assign(S,{cmode:'alt'})},
  'Metamorfose Escher (triângulo → flor)':()=>{const a=addNode('polygon',40,20,{lados:3});const b=addNode('flower',40,480,{pet:6,int:.3});const m=addNode('morph',300,40,{cel:70,curva:'suave',grade:'tri',esc:.9});const o=addNode('output',560,40);link(a,m,'A');link(b,m,'B');link(m,o,'entrada');Object.assign(S,{cmode:'morph'})},
  'Metamorfose orgânica (célula → folha)':()=>{const a=addNode('blob',40,20,{irr:.3,seed:5});const b=addNode('leaf',40,420,{nerv:0});const m=addNode('morph',300,40,{cel:64,grade:'hex',vai:true,rotD:180,esc:1.1});const o=addNode('output',560,40);link(a,m,'A');link(b,m,'B');link(m,o,'entrada');Object.assign(S,{cmode:'morph'})},
  'Flor da Vida com máscara circular':()=>{const a=addNode('flowerlife',40,40,{aneis:1,cerco:false});const t=addNode('tile',300,40,{grade:'hex',cel:120,esc:1.0});const m=addNode('mask',560,40,{forma:'circ',tam:88,cont:5,off:10,duplo:true});const o=addNode('output',820,40);link(a,t,'forma');link(t,m,'padrão');link(m,o,'entrada');Object.assign(S,{fillOn:true,rule:'evenodd',cmode:'rad'})},
  'Mandala sagrada':()=>{const a=addNode('flower',40,20,{pet:5,camadas:2});const c=addNode('metatron',40,520,{});const md=addNode('mandala',300,40,{aneis:6,base:8,inc:6,esp:62,tam:26});const o=addNode('output',560,40);link(a,md,'forma');link(c,md,'centro');link(md,o,'entrada');Object.assign(S,{cmode:'morph'})},
  'Folhas dispersas recortadas em hexágono':()=>{const a=addNode('leaf',40,40,{});const sc=addNode('scatter',300,40,{qtd:220,min:14,max:48,fluxo:true});const m=addNode('mask',560,40,{forma:'hex',tam:92,cont:3});const o=addNode('output',820,40);link(a,sc,'forma');link(sc,m,'padrão');link(m,o,'entrada');Object.assign(S,{cmode:'rand'})},
  'Forma desenhada na matriz':()=>{const a=addNode('matrix',40,40,{suave:2});const t=addNode('tile',300,40,{grade:'tijolo',cel:110,rotAlt:180});const o=addNode('output',560,40);link(a,t,'forma');link(t,o,'entrada');Object.assign(S,{cmode:'gx'})},
};
function clearGraph(){G={nodes:[],links:[]};nid=1;selected=null;world.querySelectorAll('.node').forEach(e=>e.remove());drawWires()}
function loadPreset(name){clearGraph();PRESETS[name]();syncSide();requestAnimationFrame(()=>{fit();changed()})}
const ps=document.getElementById('presetSel');Object.keys(PRESETS).forEach(k=>ps.add(new Option(k,k)));ps.onchange=()=>{if(ps.value)loadPreset(ps.value);ps.value=''};

/* =================== RIBBON =================== */
let curTab='gen';
function buildRibbon(){const tabs=document.getElementById('tabs'),rib=document.getElementById('ribbon');
  tabs.innerHTML=Object.entries(CATS).map(([k,[l,c]])=>`<button class="tab ${k===curTab?'on':''}" data-k="${k}"><i style="background:var(${c})"></i>${l}</button>`).join('');
  rib.innerHTML=Object.entries(DEFS).filter(([k,d])=>d.cat===curTab).map(([k,d])=>`<button class="btn" data-t="${k}"><i style="background:var(${CATS[d.cat][1]})"></i>${d.t}</button>`).join('')}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('.tab');if(b){curTab=b.dataset.k;buildRibbon()}};
document.getElementById('ribbon').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;
  if(b.dataset.t==='output'&&G.nodes.some(n=>n.type==='output')){toast('Já existe um nó Saída');return}
  const r=graphEl.getBoundingClientRect();const n=addNode(b.dataset.t,(r.width/2-view.x)/view.z-100+(Math.random()*40-20),(r.height/2-view.y)/view.z-120+(Math.random()*40-20));
  if(selected){const s=nodeById(selected),def=DEFS[n.type],sd=DEFS[s.type];const port=def.in.find(i=>!G.links.some(l=>l.to===n.id&&l.port===i.n)&&sd.out&&canConnect(sd.out,i.t));
    if(port&&s.id!==n.id){n.x=s.x+260;n.y=s.y;buildNode(n);link(s,n,port.n)}}
  select(n.id);drawWires();changed()};

/* =================== PAINEL LATERAL =================== */
const $=id=>document.getElementById(id);
function syncSide(){['W','H','bg','stroke','fillA','fillB','maskCol','cmode','lw','rule'].forEach(k=>$(k).value=S[k]);$('fillOn').checked=S.fillOn;$('strokeOn').checked=S.strokeOn;$('tile2').checked=S.tile2;$('lwv').textContent=(+S.lw).toFixed(1)}
['bg','stroke','fillA','fillB','maskCol','cmode','rule'].forEach(k=>$(k).addEventListener('input',()=>{S[k]=$(k).value;changed()}));
$('lw').oninput=()=>{S.lw=+$('lw').value;$('lwv').textContent=S.lw.toFixed(1);changed()};
['fillOn','strokeOn','tile2'].forEach(k=>$(k).onchange=()=>{S[k]=$(k).checked;changed()});
['W','H'].forEach(k=>$(k).onchange=()=>{S[k]=clamp(Math.round(+$(k).value||1000),64,8000);$(k).value=S[k];changed()});
$('sizeSel').onchange=()=>{const v=$('sizeSel').value;if(!v)return;const[w,h]=v.split('x').map(Number);S.W=w;S.H=h;syncSide();$('sizeSel').value='';changed()};
$('palettes').innerHTML=PALETTES.map((p,i)=>`<button title="${p[0]}" data-i="${i}">${p.slice(1).map(c=>`<span style="background:${c}"></span>`).join('')}</button>`).join('');
$('palettes').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const p=PALETTES[+b.dataset.i];Object.assign(S,{bg:p[1],stroke:p[2],fillA:p[3],fillB:p[4],maskCol:p[2]});syncSide();changed()};

let dlNS;const dlP=(window.claude&&window.claude.use)?window.claude.use('downloads').then(d=>dlNS=d).catch(()=>dlNS=null):Promise.resolve(dlNS=null);
async function download(name,blob){await dlP;if(dlNS){try{await dlNS.save({filename:name,data:blob});toast('Ficheiro guardado')}catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited')return toast('Aguarda um momento e tenta de novo');toast('Não foi possível guardar aqui')}return}
  if(window.parent!==window)return toast('Download indisponível nesta vista');
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
$('btnPNG').onclick=()=>{const pat=outputPattern();if(!pat)return toast('Nada ligado à Saída');const c=document.createElement('canvas');c.width=S.W;c.height=S.H;renderPattern(c.getContext('2d'),pat,S.W,S.H,S);c.toBlob(b=>download(`pattern-${S.W}x${S.H}.png`,b),'image/png')};
$('btnSVG').onclick=()=>{const pat=outputPattern();if(!pat)return toast('Nada ligado à Saída');download(`pattern-${S.W}x${S.H}.svg`,new Blob([toSVG(pat,S.W,S.H,S)],{type:'image/svg+xml'}))};
$('btnSaveJ').onclick=()=>download('pattern-graph.json',new Blob([JSON.stringify({G,S,view},null,1)],{type:'application/json'}));
$('fileJ').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{loadState(JSON.parse(await f.text()));toast('Grafo carregado')}catch(err){toast('Ficheiro inválido')}e.target.value=''};
$('btnClear').onclick=()=>{clearGraph();addNode('output',520,60);changed()};
$('btnFit').onclick=fit;

function save(){try{localStorage.setItem('patternNodes.v1',JSON.stringify({G,S,view}))}catch(e){}}
function loadState(st){clearGraph();Object.assign(S,st.S||{});if(st.view)view=st.view;applyView();
  for(const n of st.G.nodes){if(!DEFS[n.type])continue;const m={id:n.id,type:n.type,x:n.x,y:n.y,params:{}};DEFS[n.type].p.forEach(p=>m.params[p.k]=p.def);Object.assign(m.params,n.params);G.nodes.push(m);buildNode(m);nid=Math.max(nid,n.id+1)}
  G.links=st.G.links.filter(l=>nodeById(l.from)&&nodeById(l.to));syncSide();requestAnimationFrame(()=>{drawWires();changed()})}
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1800)}
window.addEventListener('resize',()=>drawWires());
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>changed());

/* =================== INÍCIO =================== */
buildRibbon();applyView();
let st=null;try{st=JSON.parse(localStorage.getItem('patternNodes.v1')||'null')}catch(e){}
if(st&&st.G&&st.G.nodes&&st.G.nodes.length)loadState(st);else{syncSide();loadPreset('Metamorfose Escher (triângulo → flor)')}
</script>
